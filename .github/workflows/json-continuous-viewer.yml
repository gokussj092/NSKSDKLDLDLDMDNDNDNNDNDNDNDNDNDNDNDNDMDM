name: Continuous JSON viewer validation
on:
  push:
    branches: [feat/nuevas-integraciones]
    paths:
      - .github/workflows/json-continuous-viewer.yml
      - android/app/src/main/cpp/result_engine*
      - android/app/src/main/java/com/ghostdeveloper/spdecode/ContinuousJsonView.kt
      - android/app/src/main/java/com/ghostdeveloper/spdecode/JsonTreeViewer.kt
      - android/app/src/main/java/com/ghostdeveloper/spdecode/LargeResultViewer.kt
      - android/app/src/main/java/com/ghostdeveloper/spdecode/results/NativeResultEngine.kt
      - android/app/build.gradle.kts
      - android/app/src/sharedAndroidTest/**
      - tests/native/result_lines_test.cpp
      - tests/native/result_engine_jni/**
      - scripts/qa/continuous_json_viewer.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuous-json-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native sanitizer, JNI and Kotlin contracts
        run: python3 scripts/qa/continuous_json_viewer.py --jni-include "$JAVA_HOME/include" --cache "$RUNNER_TEMP/viewer-kotlin" --report "$RUNNER_TEMP/viewer-host-qa.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-json-host-qa
          path: ${{ runner.temp }}/viewer-host-qa.json
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SPDECODE_CLOUD_RELEASE: 'true'
      SPDECODE_CLOUD_QA_BUILD: 'false'
      SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install native toolchain
        run: |
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$MANAGER" --install "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and run actual Android viewer tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=com.ghostdeveloper.spdecode.JsonTreeViewerInstrumentedTest,com.ghostdeveloper.spdecode.SingleResultViewInstrumentedTest,com.ghostdeveloper.spdecode.LargeResultEngineInstrumentedTest :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-json-android-qa
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
