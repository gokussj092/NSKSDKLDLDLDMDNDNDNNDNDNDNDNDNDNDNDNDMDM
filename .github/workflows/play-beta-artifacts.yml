name: SP-DECODE Play closed-test AAB and external beta APK
# One-time isolated Play candidate build; no release publishing and no changes to main.
on:
  workflow_dispatch:
  push:
    branches:
      - build/aab-1-1-26-b41-45db1d4
    paths:
      - .github/workflows/play-beta-artifacts.yml

permissions:
  contents: read

concurrency:
  group: spdecode-play-beta-${{ github.ref }}
  cancel-in-progress: true

# Public Firebase identifiers only; an empty configuration keeps periodic delivery.
env:
  ORG_GRADLE_PROJECT_noticeFirebaseAPP_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_APP_ID }}
  ORG_GRADLE_PROJECT_noticeFirebaseAPI_KEY: ${{ vars.SPDECODE_NOTICE_FIREBASE_API_KEY }}
  ORG_GRADLE_PROJECT_noticeFirebasePROJECT_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_PROJECT_ID }}
  ORG_GRADLE_PROJECT_noticeFirebaseSENDER_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_SENDER_ID }}

jobs:
  signed-artifacts:
    if: >-
      github.repository == 'gokussj092/NSKSDKLDLDLDMDNDNDNNDNDNDNDNDNDNDNDNDMDM' &&
      github.event.repository.private == true &&
      (github.ref == 'refs/heads/fix/http-jireh-current-method' || github.ref == 'refs/heads/feat/catalog-notifications-donations' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/aab-1-1-26-b41-45db1d4') &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK, CMake and NDK
        run: |
          set -euo pipefail
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$MANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Restore the existing permanent signing key, never generate a new one
        env:
          STORE_BASE64: ${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
          PLAY_CERT: ${{ secrets.SPDECODE_PLAY_APP_SIGNER_SHA256 || vars.SPDECODE_PLAY_APP_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$STORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Missing existing SPDECODE_SIGNING_* repository secrets"; exit 1;
          }
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spdecode-beta.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/spdecode-beta.p12" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          UPLOAD_CERT="$(keytool -exportcert -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/spdecode-beta.p12" -storepass:env STORE_PASSWORD \
            -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          [[ "$UPLOAD_CERT" =~ ^[0-9a-f]{64}$ ]]
          # Accept repository Actions Secret (recommended by owner), or the
          # historical repository Variable. Never ship a Play AAB with no pin.
          PLAY_CERT="$(printf '%s' "$PLAY_CERT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_PLAY_CERT="64760393e52521294b40a1fd978b5bae732b7d8604bd222ca01166a25407854b"
          if [[ ! "$PLAY_CERT" =~ ^[0-9a-f]{64}$ || "$PLAY_CERT" != "$EXPECTED_PLAY_CERT" ]]; then
            echo "::error::Play App Signing SHA-256 is missing/incorrect. Configure SPDECODE_PLAY_APP_SIGNER_SHA256 as Actions secret (or variable) with Play Console's APP SIGNING cert, NOT upload cert."
            exit 1
          fi
          echo "SPDECODE_TRUSTED_SIGNER_SHA256=$UPLOAD_CERT" >> "$GITHUB_ENV"
          echo "SPDECODE_PLAY_APP_SIGNER_SHA256=$PLAY_CERT" >> "$GITHUB_ENV"
          echo "SPDECODE_RELEASE_STORE_FILE=$RUNNER_TEMP/spdecode-beta.p12" >> "$GITHUB_ENV"
      - name: Build cloud-enabled, signed Telegram APK first
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
          SPDECODE_CLOUD_RELEASE: "true"
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Build signed Google Play AAB with Play In-App Updates only
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
          SPDECODE_CLOUD_RELEASE: "true"
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon -PspdecodePlayAab=true :app:bundleRelease
      - name: Reject missing or mismatched release signer pins before publishing
        run: python3 scripts/ci/verify_release_signer_pins.py
      - name: Verify Play AAB includes all XML locales without language splits
        run: python3 scripts/ci/verify_aab_locales.py android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify signed APK and AAB and prepare versioned artifacts
        env:
          STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          python3 scripts/ci/verify_play_update_artifacts.py "$APK" "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-signature.txt"
          grep -q '^jar verified\.' "$RUNNER_TEMP/aab-signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/app-badging.txt"
          grep -F "package: name='com.ghostdeveloper.spdecode'" "$RUNNER_TEMP/app-badging.txt" >/dev/null
          grep -F "versionName='1.1.26'" "$RUNNER_TEMP/app-badging.txt" >/dev/null
          grep -F "versionCode='41'" "$RUNNER_TEMP/app-badging.txt" >/dev/null
          # A good upload signature alone is insufficient. Check every 64-bit
          # ELF in both packages, and verify the APK ZIP's 16 KiB alignment.
          python3 -m unittest tests.test_android_play_compatibility tests.test_android_play_update_artifact_contract -v
          python3 scripts/android_16kb_elf_audit.py "$APK" "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          mkdir -p dist
          cp "$APK" dist/SP-DECODE-v1.1.26-beta-external-signed.apk
          cp "$AAB" dist/SP-DECODE-v1.1.26-play-closed-test-signed.aab
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          printf 'Package: com.ghostdeveloper.spdecode\nVersion: 1.1.26\nVersion code: 41\nSource commit: %s\nUpload certificate SHA-256: %s\nPlay app signing certificate SHA-256: %s\n' \
            "$GITHUB_SHA" "$SPDECODE_TRUSTED_SIGNER_SHA256" "${SPDECODE_PLAY_APP_SIGNER_SHA256:-NOT_SET}" \
            > dist/SIGNATURE_VERIFICATION.txt
      - name: Publish artifacts only to the private workflow run, never to Releases
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-v1.1.26-PLAY-BETA-SIGNED
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # Existing AAB/APK are already stored above. The ownership verification
      # APK is different and contains a one-time Play Console registration code.
      # Never commit the code or pack it into any public distribution artifact.
      - name: Prepare optional private package-name ownership verification
        # The proof APK embeds a one-time registration token; do NOT publish
        # it as an artifact in this now-public repository.
        if: ${{ github.event.repository.private == true }}
        id: ownership
        env:
          ADI_SNIPPET: ${{ secrets.SPDECODE_ADI_REGISTRATION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$ADI_SNIPPET" ]]; then
            echo "::notice::Ownership verification skipped: add SPDECODE_ADI_REGISTRATION_TOKEN under repository Actions secrets, then rerun this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare the secret with the exact current Play Console snippet.
          # Only its SHA-256 digest is committed; never print the token itself.
          # Strip accidental surrounding whitespace from copy/paste.
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          snippet = os.environ["ADI_SNIPPET"].strip()
          expected_sha256 = "c7784c3de2760a08337e1a1e3e7c154de4918c2be6c925f40cc19f4945b0d17d"
          if not snippet or hashlib.sha256(snippet.encode("utf-8")).hexdigest() != expected_sha256:
              print("::error::The secret SPDECODE_ADI_REGISTRATION_TOKEN does not match the current snippet copied from Play Console. Replace the secret with the exact code displayed in the current verification screen (without quotes).")
              sys.exit(1)
          if len(snippet) > 4096:
              print("::error::Registration snippet exceeds the size limit.")
              sys.exit(1)
          dest = pathlib.Path("android/app/src/main/assets/adi-registration.properties")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(snippet, encoding="utf-8")
          dest.chmod(0o600)
          PY
          EXPECTED="0fa9f07f2c47464925f3a7b222c9a39ef887738f678b9c918ec6c4fb96162260"
          if [[ "$SPDECODE_TRUSTED_SIGNER_SHA256" != "$EXPECTED" ]]; then
            echo "::error::Play Console's selected key does not match this repository's permanent signing key."
            echo "::error::Selected SHA-256: $EXPECTED"
            echo "::error::Repository signer SHA-256: $SPDECODE_TRUSTED_SIGNER_SHA256"
            echo "::error::Choose the matching eligible key in Play Console. Never replace the original release keystore."
            exit 1
          fi
          # File was already written with the verified, normalized snippet.
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build separate ownership-verification APK with original signing key
        if: steps.ownership.outputs.ready == 'true'
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
          SPDECODE_CLOUD_RELEASE: "true"
          SPDECODE_ADI_VERIFICATION_BUILD: "true"
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify ownership APK contains only the temporary registration asset and correct signing identity
        if: steps.ownership.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -Z -1 "$APK" | grep -Fx 'assets/adi-registration.properties'
          test "$(unzip -p "$APK" assets/adi-registration.properties | sha256sum | cut -d' ' -f1)" = "$(sha256sum android/app/src/main/assets/adi-registration.properties | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/adi-verified-signature.txt"
          grep -Fi "Signer #1 certificate SHA-256 digest: 0fa9f07f2c47464925f3a7b222c9a39ef887738f678b9c918ec6c4fb96162260" "$RUNNER_TEMP/adi-verified-signature.txt" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ghostdeveloper.spdecode'" >/dev/null
          mkdir -p verification-dist
          cp "$APK" verification-dist/SP-DECODE-package-name-ownership-verification.apk
          (cd verification-dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload Google package-name ownership APK separately (not a production release)
        if: steps.ownership.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-PLAY-PACKAGE-OWNERSHIP-VERIFICATION
          path: verification-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary verification identifier and keystore
        if: always()
        run: |
          rm -f android/app/src/main/assets/adi-registration.properties
          rm -f "$RUNNER_TEMP/spdecode-beta.p12"

