name: SP-DECODE public Cloud preproduction signed APK
# Public prerelease is produced only after a single consolidated source update.
on:
  push:
    branches: ["feat/austroplus-vpn-13-0-1-decoders"]
    paths: [".github/workflows/cloud-preproduction-public.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spdecode-public-preprod-${{ github.ref }}
  cancel-in-progress: false
# Public Firebase identifiers only; an empty configuration keeps periodic delivery.
env:
  ORG_GRADLE_PROJECT_noticeFirebaseAPP_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_APP_ID }}
  ORG_GRADLE_PROJECT_noticeFirebaseAPI_KEY: ${{ vars.SPDECODE_NOTICE_FIREBASE_API_KEY }}
  ORG_GRADLE_PROJECT_noticeFirebasePROJECT_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_PROJECT_ID }}
  ORG_GRADLE_PROJECT_noticeFirebaseSENDER_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_SENDER_ID }}

jobs:
  public-preproduction-apk:
    if: github.repository == 'Gh0stDeveloper/SP-DECODE' && github.ref == 'refs/heads/feat/austroplus-vpn-13-0-1-decoders'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android build SDK and NDK
        run: |
          set -euo pipefail
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$MANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Restore existing production signing key
        env:
          STORE_BASE64: ${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
          PLAY_APP_CERT: ${{ vars.SPDECODE_PLAY_APP_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$STORE_BASE64" && test -n "$STORE_PASSWORD" &&
            test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
              echo "::error::Missing permanent SPDECODE_SIGNING_* secrets"; exit 1;
            }
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spdecode-preprod.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/spdecode-preprod.p12" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          CERT="$(keytool -exportcert -storetype PKCS12 -keystore "$RUNNER_TEMP/spdecode-preprod.p12" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          if [[ "$CERT" != "0fa9f07f2c47464925f3a7b222c9a39ef887738f678b9c918ec6c4fb96162260" ]]; then
            echo "::error::Original APK production signing identity mismatch"; exit 1
          fi
          if [[ -n "$PLAY_APP_CERT" && ! "$PLAY_APP_CERT" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Malformed Play app-signing certificate value"; exit 1
          fi
          echo "SPDECODE_TRUSTED_SIGNER_SHA256=$CERT" >> "$GITHUB_ENV"
          echo "SPDECODE_PLAY_APP_SIGNER_SHA256=$PLAY_APP_CERT" >> "$GITHUB_ENV"
          echo "SPDECODE_RELEASE_STORE_FILE=$RUNNER_TEMP/spdecode-preprod.p12" >> "$GITHUB_ENV"
      - name: Guard QA mode, version and ownership token absence
        run: |
          set -euo pipefail
          test ! -e android/app/src/main/assets/adi-registration.properties
          grep -Fq 'versionCode = 34' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.1.24"' android/app/build.gradle.kts
      - name: Compile signed Cloud release without QA
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
          SPDECODE_CLOUD_RELEASE: "true"
          SPDECODE_CLOUD_QA_BUILD: "false"
          SPDECODE_ADI_VERIFICATION_BUILD: "false"
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Audit signed APK (identity, Cloud origin, privacy, no verification secret)
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test ! -e android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: 0fa9f07f2c47464925f3a7b222c9a39ef887738f678b9c918ec6c4fb96162260' "$RUNNER_TEMP/signature.txt" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/app-badging.txt"
          grep -F "package: name='com.ghostdeveloper.spdecode'" "$RUNNER_TEMP/app-badging.txt" >/dev/null
          grep -F "versionName='1.1.24'" "$RUNNER_TEMP/app-badging.txt" >/dev/null
          grep -F "versionCode='35'" "$RUNNER_TEMP/app-badging.txt" >/dev/null
          python3 tests/cloud_c5_apk_audit.py "$APK"
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('android/app/build/outputs/apk/release/app-release.apk') as apk:
              entries=apk.namelist()
              assert 'assets/adi-registration.properties' not in entries
              native=[name for name in entries if name.endswith('/libspdecode.so')]
              assert native and all(b'https://api.spdecode.xyz' in apk.read(name) for name in native)
          print('Original signer verified, native API correct, ownership token absent.')
          PY
          mkdir -p dist
          cp "$APK" dist/SP-DECODE-v1.1.24-Cloud-PREPRODUCTION-signed.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf 'SP-DECODE Cloud preproduction\nVersion: 1.1.24 (34)\nPackage: com.ghostdeveloper.spdecode\nAPI: https://api.spdecode.xyz\nQA: disabled\nSigner: permanent release key\nCommit: %s\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt
      - name: Publish public GitHub prerelease (not a Google Play release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v1.1.24-cloud-preproduction-ui.1
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          ## SP-DECODE Cloud v1.1.24 — Preproducción pública

          Incluye la nueva pantalla de idiomas y el rediseño AMOLED de Servidores VPN: búsqueda, favoritos, consulta manual y distinción «Nuevo» exclusivamente para proveedores detectados en catálogos nuevos. El aviso «Nuevo» permanece dos horas en el teléfono.
          
          APK firmado con la clave original de Ghost Nexora Studio. Requiere Internet y se conecta a https://api.spdecode.xyz. No incluye interfaz QA ni el token de verificación de propiedad de Google Play.

          **La API debe estar actualizada.** Para permitir a usuarios externos instalarlo mientras Google Play revisa la aplicación, el operador del servidor debe habilitar temporalmente la admisión beta desde el panel (máximo 15 días). Sin esa configuración, el servidor exige Google Play Integrity.

          Versión experimental, no aprobada ni distribuida por Google Play. Su instalación no cuenta como inscripción al programa de pruebas cerradas. Compatibilidad variable según formato.
          
          Conserva com.ghostdeveloper.spdecode, v1.1.24 y versionCode 34. Una APK QA instalada con versionCode superior puede requerir desinstalación previa: realiza copia de seguridad antes.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Prerelease already exists; refusing to overwrite existing public binary"
            exit 1
          fi
          gh release create "$TAG" dist/SP-DECODE-v1.1.24-Cloud-PREPRODUCTION-signed.apk dist/SHA256SUMS.txt dist/BUILD_INFO.txt \
            --target "$GITHUB_SHA" --title "SP-DECODE Cloud v1.1.24 — Preproducción pública" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" --prerelease
          gh release view "$TAG" --json url,assets,isPrerelease \
            --jq '{url: .url, isPrerelease: .isPrerelease, assets: [.assets[].name]}'
      - name: Back up signed preproduction APK in GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-v1.1.24-PUBLIC-CLOUD-PREPRODUCTION-SIGNED
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Wipe private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/spdecode-preprod.p12"

