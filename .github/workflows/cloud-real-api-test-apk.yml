name: SP-DECODE Cloud Real API QA APK
on:
  push:
    branches: ["feat/cloud-c8-vps-installer-updater"]
    paths:
      - ".github/workflows/cloud-real-api-test-apk.yml"
      - "android/app/**"
      - "cloud/web/lib/c3-config.mjs"
      - "cloud/web/lib/c3-session.mjs"
      - "cloud/web/lib/c3-gateway.mjs"
      - "cloud/web/app/api/v1/session/qa/**"
      - "cloud/infra/vps/qa-test.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-real-api-qa-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-real-api-qa-apk:
    name: Signed Cloud QA APK - api.spdecode.xyz
    if: github.repository == 'Gh0stDeveloper/SP-DECODE' && github.ref == 'refs/heads/feat/cloud-c8-vps-installer-updater'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install SDK NDK and native build dependencies
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Load existing permanent signer securely (not a generated test certificate)
        env:
          STORE_BASE64: ${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for item in "$STORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$item" ]]; then
              echo "::error::Missing existing SPDECODE_SIGNING_* secret. Do not generate another keystore."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spdecode-qa-signing.p12"
          export SPDECODE_RELEASE_STORE_PASSWORD="$STORE_PASSWORD"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/spdecode-qa-signing.p12" \
            -storepass:env SPDECODE_RELEASE_STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          DIGEST="$(keytool -exportcert -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/spdecode-qa-signing.p12" \
            -storepass:env SPDECODE_RELEASE_STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "SPDECODE_TRUSTED_SIGNER_SHA256=$DIGEST" >> "$GITHUB_ENV"
      - name: Make QA version distinct from released app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          file=Path("android/app/build.gradle.kts")
          src=file.read_text()
          src,n=re.subn(r'versionCode = \d+', 'versionCode = 29', src)
          assert n==1
          src,n=re.subn(r'versionName = "[^"]+"', 'versionName = "1.2.3-qa"', src)
          assert n==1
          file.write_text(src)
          PY
      - name: Compile signed Cloud-only APK using REAL production API origin
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
          SPDECODE_CLOUD_RELEASE: "true"
          SPDECODE_CLOUD_QA_BUILD: "true"
          SPDECODE_RELEASE_STORE_FILE: ${{ runner.temp }}/spdecode-qa-signing.p12
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify QA Settings exists only in generated client UI
        run: |
          set -euo pipefail
          GENERATED=android/app/build/generated/c5-client/java/com/ghostdeveloper/spdecode/FunctionalSettingsPanel.kt
          ORIGINAL=android/app/src/main/java/com/ghostdeveloper/spdecode/FunctionalSettingsPanel.kt
          test -s "$GENERATED"
          grep -F 'com.ghostdeveloper.spdecode.cloud.CloudQaSettingsCard()' "$GENERATED"
          if grep -Fq 'CloudQaSettingsCard()' "$ORIGINAL"; then
            echo "::error::C0 UI source modified instead of generated QA copy"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          src=Path("android/app/build/generated/c5-client/java/com/ghostdeveloper/spdecode/FunctionalSettingsPanel.kt").read_text()
          assert src.count('CloudQaSettingsCard()')==1
          assert 'CloudQaSettingsCard()\\n' not in src
          print("QA credential entry is present in the existing Settings panel; original UI untouched.")
          PY
      - name: Check route-specific NUR client deadline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("android/app/src/main/cpp/spdecode_transport.cpp").read_text()
          assert 'kReadTimeoutMs = 25000' in s
          assert 'kNurCatalogReadTimeoutMs = 165000' in s
          assert 'path == "/api/v1/decode/import/catalog/remote"' in s
          assert 'setRead,readTimeout' in s
          print("Only remote NUR catalog gets a longer client read deadline")
          PY
      - name: Validate APK and native HTTPS origin
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/qa-cert-verify.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/qa-badging.txt"
          grep -F "package: name='com.ghostdeveloper.spdecode'" "$RUNNER_TEMP/qa-badging.txt"
          grep -F "versionName='1.2.3-qa'" "$RUNNER_TEMP/qa-badging.txt"
          grep -F "versionCode='29'" "$RUNNER_TEMP/qa-badging.txt"
          python3 tests/cloud_c5_apk_audit.py "$APK"
          python3 - <<'PY'
          from zipfile import ZipFile
          apk="android/app/build/outputs/apk/release/app-release.apk"
          with ZipFile(apk) as archive:
              strings=b"".join(archive.read(path) for path in archive.namelist()
                               if path.endswith(".dex"))
          assert b"Activar acceso QA" in strings, "QA settings card missing from compiled APK"
          print("QA entry button confirmed in compiled Android DEX")
          PY
          python3 - <<'PY'
          from zipfile import ZipFile
          f="android/app/build/outputs/apk/release/app-release.apk"
          with ZipFile(f) as z:
              libs=[p for p in z.namelist() if p.endswith("/libspdecode.so")]
              assert libs, "Missing Cloud JNI library"
              for lib in libs:
                  data=z.read(lib)
                  assert b"https://api.spdecode.xyz" in data, f"Missing real HTTPS origin in {lib}"
                  assert b"api.spdecode.example" not in data, f"Example host leaked in {lib}"
              assert not any(p.endswith(".spv") for p in z.namelist()), "Legacy secure vault must not be shipped"
          print("Confirmed native client connects to https://api.spdecode.xyz (not to an example server)")
          PY
      - name: Prepare private QA artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/SP-DECODE-v1.2.3-qa29-CLOUD-REAL-API.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo "Channel: QA only; no Play Store release or production claim"
            echo "API: https://api.spdecode.xyz"
            echo "Package: com.ghostdeveloper.spdecode"
            echo "VersionName: 1.2.3-qa"
            echo "VersionCode: 29"
            echo "Source commit: $GITHUB_SHA"
            echo "Signing: existing repository permanent key"
            echo "QA: Settings > Cloud QA > enter temporary code from sudo spdecode qa start"
            echo "Production: Play Integrity remains required; QA mode expires after four hours"
          } > dist/QA-README.txt
      - name: Upload installable signed QA APK (only GitHub Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-Cloud-v1.2.3-qa29-REAL-API
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Erase temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/spdecode-qa-signing.p12"
