name: SP-DECODE Admin Android Preview
on:
  workflow_dispatch:
  push:
    branches: [feat/android-admin-panel]
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-preview.yml'
permissions:
  contents: read
concurrency:
  group: android-admin-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Validate native routes and JVM bridge
        run: |
          sh android-admin/tests/run-native.sh
          sh android-admin/tests/run-jni-host.sh
      - name: Compile, lint and test isolated preview
        run: gradle -p android-admin :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --console=plain
      - name: Run reference flows on accelerated Android
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;default;x86_64'
          echo no | avdmanager create avd -n admin-review -k 'system-images;android-35;default;x86_64' --device pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -avd admin-review -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 > /tmp/admin-emulator.log 2>&1 &
          trap 'adb emu kill || true' EXIT
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          gradle -p android-admin :app:connectedDebugAndroidTest --console=plain &
          test_pid=$!
          wait "$test_pid" && test_result=0 || test_result=$?
          mkdir -p android-admin/app/build/review
          adb pull /sdcard/Android/data/com.ghostdeveloper.spdecode.admin.preview/files/review/. android-admin/app/build/review/ || true
          cp /tmp/admin-emulator.log android-admin/app/build/review/emulator.log
          exit "$test_result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP-DECODE-Admin-Preview
          path: |
            android-admin/app/build/outputs/apk/debug/*.apk
            android-admin/app/build/reports/lint-results-debug.html
            android-admin/app/build/reports/tests/testDebugUnitTest/
            android-admin/app/build/reports/androidTests/
            android-admin/app/build/outputs/androidTest-results/
            android-admin/app/build/review/
          if-no-files-found: error
