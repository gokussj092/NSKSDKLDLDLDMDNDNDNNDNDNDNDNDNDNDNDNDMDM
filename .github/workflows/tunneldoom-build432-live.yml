name: TunnelDOOM build432 static and live catalog proof
on:
  push:
    branches: [feat/nuevas-integraciones]
    paths:
      - analysis/com.tunneldoom.http/432/**
      - .github/workflows/tunneldoom-build432-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fixed static inspection dependencies
        run: python -m pip install pycryptodome==3.23.0 androguard==4.1.3
      - name: Acquisition and negative security fixtures
        run: python -m unittest discover -s analysis/com.tunneldoom.http/432/tests -v
      - name: Actual identity, updater code and complete JCA parity
        run: python analysis/com.tunneldoom.http/432/tools/revalidate.py --report "$RUNNER_TEMP/tunneldoom-432-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tunneldoom-432-sanitized-proof
          path: ${{ runner.temp }}/tunneldoom-432-proof.json
          if-no-files-found: ignore
