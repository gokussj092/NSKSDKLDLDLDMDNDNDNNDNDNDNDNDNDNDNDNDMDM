name: SP-DECODE HPKE Cloud web prebuilt image
# Build only on GitHub runners, never on the resource-constrained VPS.
# No runtime secrets are included in the image.
on:
  push:
    branches:
      - security/v2-hpke-x25519-encrypted-transport
    paths:
      - .github/workflows/cloud-security-web-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: spdecode-hpke-web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cloud-web:
    if: github.repository_owner == 'gokussj092' && github.ref == 'refs/heads/security/v2-hpke-x25519-encrypted-transport'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push only the web/API container
        uses: docker/build-push-action@v6
        with:
          context: ./cloud/web
          file: ./cloud/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gokussj092/spdecode-web-hpke:security-test
            ghcr.io/gokussj092/spdecode-web-hpke:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Deployment information
        run: |
          echo "IMAGE=ghcr.io/gokussj092/spdecode-web-hpke:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No VPS build, no Android build, no Play upload and no runtime secrets used." >> "$GITHUB_STEP_SUMMARY"
