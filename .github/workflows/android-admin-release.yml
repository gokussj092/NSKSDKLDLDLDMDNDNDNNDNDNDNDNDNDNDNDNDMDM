name: SP-DECODE Admin Signed Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o SHA a compilar; vacío usa la rama seleccionada'
        required: false
        type: string
        default: ''
  push:
    branches: ["**"]
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-release.yml'
      - 'tests/test_android_admin_workflow.py'
      - 'cloud/web/lib/commerce/mobile-admin.mjs'
      - 'cloud/web/app/api/admin/mobile/**'
      - 'cloud/web/tests/mobile-admin.test.mjs'
      - 'cloud/web/lib/commerce/support.mjs'
      - 'cloud/web/tests/staff-console.test.mjs'
      - 'scripts/android_16kb_elf_audit.py'
permissions:
  contents: read
concurrency:
  group: android-admin-release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend contracts
        working-directory: cloud/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if [ -f ../../tests/test_android_admin_workflow.py ]; then
            (cd ../.. && python3 -m unittest tests.test_android_admin_workflow -v)
          fi
          node --test tests/mobile-admin.test.mjs tests/staff-console.test.mjs tests/c6-admin.test.mjs
      - name: Validate native routes and JVM bridge
        run: |
          sh android-admin/tests/run-native.sh
          sh android-admin/tests/run-jni-host.sh
      - name: Restore permanent signing key
        env:
          STORE_BASE64: ${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in STORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta la firma persistente: $name. No se generará otra clave."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spdecode-admin-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/spdecode-admin-release.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore "$RUNNER_TEMP/spdecode-admin-release.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/admin-signer-sha256"
          echo "SPDECODE_RELEASE_STORE_FILE=$RUNNER_TEMP/spdecode-admin-release.p12" >> "$GITHUB_ENV"
          # Apply after the selected branch's DSL, before AGP creates any variant.
          # This also covers old branches whose Debug variant used a default key.
          cat > "$RUNNER_TEMP/admin-permanent-signing.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              if (project.path == ':app') {
                  project.plugins.withId('com.android.application') {
                      project.extensions.getByName('androidComponents').finalizeDsl({ android ->
                          if (android.namespace != 'com.ghostdeveloper.spdecode.admin') {
                              throw new GradleException('Expected the SP-DECODE Admin application')
                          }
                          def required = [:]
                          ['SPDECODE_RELEASE_STORE_FILE', 'SPDECODE_RELEASE_STORE_PASSWORD',
                           'SPDECODE_RELEASE_KEY_ALIAS', 'SPDECODE_RELEASE_KEY_PASSWORD'].each { name ->
                              def value = System.getenv(name)
                              if (!value) throw new GradleException('Permanent signing required: ' + name)
                              required[name] = value
                          }
                          def store = new File(required['SPDECODE_RELEASE_STORE_FILE'])
                          if (!store.isFile()) throw new GradleException('Permanent signing store missing')
                          def signing = android.signingConfigs.findByName('production')
                          if (signing == null) signing = android.signingConfigs.create('production')
                          signing.storeFile = store
                          signing.storePassword = required['SPDECODE_RELEASE_STORE_PASSWORD']
                          signing.keyAlias = required['SPDECODE_RELEASE_KEY_ALIAS']
                          signing.keyPassword = required['SPDECODE_RELEASE_KEY_PASSWORD']
                          signing.enableV1Signing = true
                          signing.enableV2Signing = true
                          signing.enableV3Signing = true
                          android.buildTypes.each { buildType -> buildType.signingConfig = signing }
                      } as org.gradle.api.Action)
                  }
              }
          }
          GRADLE
      - name: Compile signed release with R8, lint and tests
        env:
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --init-script "$RUNNER_TEMP/admin-permanent-signing.init.gradle" -p android-admin :app:assembleRelease :app:lintRelease :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --console=plain
      - name: Verify permanent signer and APK contents
        run: |
          set -euo pipefail
          EXPECTED=$(cat "$RUNNER_TEMP/admin-signer-sha256")
          for APK in \
            android-admin/app/build/outputs/apk/release/app-release.apk \
            android-admin/app/build/outputs/apk/debug/app-debug.apk \
            android-admin/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            test -s "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/admin-certificate.txt"
            grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/admin-certificate.txt"
            grep -Fx "Signer #1 certificate SHA-256 digest: $EXPECTED" "$RUNNER_TEMP/admin-certificate.txt"
          done
          mkdir -p android-admin/app/build/review
          git rev-parse HEAD > android-admin/app/build/review/SOURCE_COMMIT.txt
          APK=android-admin/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          python3 scripts/android_16kb_elf_audit.py "$APK" --library libspdecode_admin.so
          test -s android-admin/app/build/outputs/mapping/release/mapping.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F android.permission.INTERNET
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ghostdeveloper.spdecode.admin'"
          sha256sum "$APK" > android-admin/app/build/review/SHA256SUMS.txt
      - name: Run reference flows on accelerated Android
        env:
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;default;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/admin-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n admin-review -k 'system-images;android-35;default;x86_64' --device pixel_6 --path "$RUNNER_TEMP/admin-review.avd" --force
          python3 - <<'PYAVD'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'admin-review.avd/config.ini'
          lines = path.read_text().splitlines()
          updates = {'disk.dataPartition.size': '2G', 'hw.ramSize': '2048'}
          lines = [line for line in lines if line.split('=', 1)[0] not in updates]
          path.write_text('\n'.join(lines + [key + '=' + value for key, value in updates.items()]) + '\n')
          index = Path(os.environ['ANDROID_AVD_HOME']) / 'admin-review.ini'
          index.write_text('avd.ini.encoding=UTF-8\npath=' + str(path.parent) + '\ntarget=android-35\n')
          PYAVD
          mkdir -p android-admin/app/build/review
          EMU_LOG="$PWD/android-admin/app/build/review/emulator.log"
          "$ANDROID_HOME/emulator/emulator" -avd admin-review -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on -memory 2048 > "$EMU_LOG" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill || true; tail -n 100 "$EMU_LOG" || true' EXIT
          adb start-server
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$EMU_LOG"; exit 1; fi
            if timeout 5 adb get-state 2>/dev/null | grep -qx device; then break; fi
            sleep 2
          done
          timeout 5 adb get-state | grep -qx device
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$EMU_LOG"; exit 1; fi
            if [ "$(timeout 10 adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(timeout 10 adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          APK=android-admin/app/build/outputs/apk/release/app-release.apk
          adb install "$APK"
          adb logcat -c
          adb shell am start -W -n com.ghostdeveloper.spdecode.admin/.MainActivity
          sleep 3
          adb shell pidof com.ghostdeveloper.spdecode.admin
          adb shell uiautomator dump /sdcard/admin-release.xml
          adb pull /sdcard/admin-release.xml android-admin/app/build/review/release-ui.xml
          grep -q 'Iniciar sesión' android-admin/app/build/review/release-ui.xml
          adb logcat -d > android-admin/app/build/review/release-logcat.txt
          if grep -q 'FATAL EXCEPTION' android-admin/app/build/review/release-logcat.txt; then exit 1; fi
          adb shell screencap -p /sdcard/admin-release.png
          adb pull /sdcard/admin-release.png android-admin/app/build/review/release-login.png
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          gradle --init-script "$RUNNER_TEMP/admin-permanent-signing.init.gradle" -p android-admin :app:connectedDebugAndroidTest --console=plain &
          test_pid=$!
          wait "$test_pid" && test_result=0 || test_result=$?
          mkdir -p android-admin/app/build/review
          exit "$test_result"
      - name: Erase signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/spdecode-admin-release.p12" "$RUNNER_TEMP/admin-permanent-signing.init.gradle"
      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SP-DECODE-Admin-1.0.0-Signed-R8
          path: |
            android-admin/app/build/outputs/apk/release/*.apk
            android-admin/app/build/outputs/mapping/release/mapping.txt
            android-admin/app/build/review/SHA256SUMS.txt
            android-admin/app/build/review/SOURCE_COMMIT.txt
          if-no-files-found: error
      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP-DECODE-Admin-Diagnostics-${{ github.run_number }}
          path: |
            android-admin/app/build/reports/lint-results-release.html
            android-admin/app/build/reports/tests/testDebugUnitTest/
            android-admin/app/build/reports/androidTests/
            android-admin/app/build/outputs/androidTest-results/
            android-admin/app/build/outputs/connected_android_test_additional_output/
            android-admin/app/build/review/
          if-no-files-found: warn
