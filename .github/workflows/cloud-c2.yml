permissions:
  contents: read

jobs:
  source-parity:
    name: C2 original decoder source parity (60 synthetic samples)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PHP CLI for original decoder scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli
      - name: Install existing Python decoder dependencies
        run: python -m pip install -r requirements.txt
      - name: Install existing Node decoder dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Verify immutable Android C0 format matrix
        run: PYTHONPATH=. python scripts/cloud_c0_inventory.py --check
      - name: C2 private worker, catalog and sanitized error tests
        run: PYTHONPATH=cloud/workers/python:. python -m unittest discover -s cloud/workers/python -p 'test_*.py' -v
      - name: C2 validate source-derived Phase G text protocol parity
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_cloud_c2_text -v
      - name: C2 verify protected HCCFG password HWID and dual-lock parity
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_cloud_c2_hc -v
      - name: Verify HCX4 build 899 native key vectors and authenticated file layers
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_http_custom_899 -v
      - name: Verify TunelGuard/Wakko/SocketClay catalogs and file compatibility
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_am_liapp_metadata tests.test_am_tunnel_lite tests.test_sevennet_vpn tests.test_xhypher_tunnel_pro tests.test_ut_loop_pro tests.test_turbomx_vpn tests.test_superflash_vpn tests.test_rmp_tunnel_pro tests.test_rjc_tunnel_pro tests.test_proneet_vpn tests.test_onspace_vpn tests.test_mx_tunnel_pro tests.test_megatunnel tests.test_http_internet_infinito tests.test_freedomvpn tests.test_focus_vpn_cloud tests.test_eut_vpn tests.test_v2ray_tunnel_plus tests.test_tunelguard tests.test_http_wakko tests.test_http_socketclay tests.test_http_fenixvpn tests.test_http_jireh -v
      - name: Verify BD NET catalog, nested binary recovery, file and text
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_bd_net_vpn -v
      - name: Verify Aura Net complete catalog, exported profile and historical routes
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_aura_net_vpn -v
      - name: Verify APNA complete catalog, native profile format, text and worker
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_apna_vpn -v
      - name: Verify ANY and Speicers complete catalogs and file compatibility
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_speicers_pro tests.test_any_vpn -v
      - name: Verify V2Box fixed-key, password and tag integrity routes
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_v2box_password -v
      - name: Verify NPV text aliases, strict credential errors and legacy envelope isolation
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_npv_text tests.test_npv_cloud_password_integration -v
      - name: Verify 1FTunnel files, password handling and complete worker output
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_oneftunnel tests.test_cloud_c8_vpn_registry -v
      - name: Verify NPVS v1 legacy route, v5 protected methods, and recipient diagnostics
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_npvs_v1_legacy tests.test_npvs_protected tests.test_npvs_v5.PrimitiveTests tests.test_npvs_v5_embedded tests.test_cloud_c8_npvs_error_classification -v
      - name: Verify FlexNet v1-v6, B46 protected fields and authorized import captures
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_flexnet_b46_grant tests.test_flexnet_b46 tests.test_flexnet_b42 -v
      - name: Verify FlexNet capture observer flow with host mocks
        run: node --test tests/flexnet_b46_capture.test.mjs
      - name: C2 verify NUR server catalog remains separate from solid profiles
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_cloud_c2_nur_catalog -v
      - name: Hat Tunnel complete JSON, real fixture and optional-field regression
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_cloud_hat_complete -v
      - name: Verify original independently tested KSH DTunnel Mod and MKK methods
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_ksh_vpn tests.test_dtunnelmod tests.test_mkk_hyper -v
      - name: New KSH and DTunnel codecs and MKK four-source full-result regression
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_cloud_server_vpn_new tests.test_cloud_server_vpn_transport -v
      - name: C2 execute synthetic golden corpus through isolated subprocess adapter
        run: PYTHONPATH=cloud/workers/python:. python -m unittest tests.test_cloud_c2_golden -v

  docker-topology:
    name: C2 Docker isolated worker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate network topology
        run: docker compose -f cloud/compose.yaml config --quiet
      - name: Build C2 worker with Python Node and PHP runtimes
        run: docker compose -f cloud/compose.yaml build decoder-worker
      - name: Smoke test worker defaults to safe no-token mode
        run: |
          docker compose -f cloud/compose.yaml up -d --no-deps decoder-worker
          docker compose -f cloud/compose.yaml ps
          docker compose -f cloud/compose.yaml exec -T decoder-worker python - <<'PY'
          import urllib.error
          import urllib.request
          base = "http://127.0.0.1:8787"
          assert urllib.request.urlopen(base + "/health", timeout=5).status == 200
          try:
              urllib.request.urlopen(base + "/ready", timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 503
          else:
              raise AssertionError("Worker must not be ready without token")
          PY
      - name: Verify packaged NPVS password and error contracts in real Docker worker
        run: |
          set -eu
          # Stream only synthetic code into the read-only runtime container.
          # No test data, passwords, or fixture files are persisted to disk.
          docker compose -f cloud/compose.yaml exec -T decoder-worker python -c '
          import sys

          sys.path.insert(0, "cloud/workers/python")
          from engine import decode_file, DecodeFailure
          from decoders.Python.npvs import decode_npvs_complete
          fixture = {"__name__": "synthetic_npvs_fixture"}
          exec(compile(sys.stdin.read(), "<synthetic-fixture>", "exec"), fixture)
          vector = fixture["make"](password="fixture-only-password")
          raw = vector["data"]
          correct = {"password": vector["password"]}
          for creds, expected in (
              (None, "PASSWORD_REQUIRED"),
              ({"password": "wrong-synthetic-password"}, "AUTH_FAILED"),
          ):
              try:
                  decode_file("npvs", raw, credentials=creds)
              except DecodeFailure as exc:
                  assert exc.code == expected, (exc.code, expected)
              else:
                  raise AssertionError("protected NPVS unexpectedly succeeded")
          output = decode_file("npvs", raw, credentials=correct)
          expected = decode_npvs_complete(raw, password=correct["password"])
          assert output["structuredJson"] == expected
          assert output["isPartial"] is False
          assert output["rawText"]
          print("NPVS packaged Docker worker: PASSWORD_REQUIRED / AUTH_FAILED / complete JSON OK")
          ' < tests/golden/npvs_protected_generate.py
      - name: Run historical NPVS v1 fixture in actual read-only Docker worker
        run: |
          set -eu
          # The test module is streamed via stdin. Nothing is copied into the
          # read-only container and no user-provided NPVS files are persisted.
          docker compose -f cloud/compose.yaml exec -T decoder-worker python -c '
          import sys
          from pathlib import Path
          sys.path.insert(0, "cloud/workers/python")
          module={"__name__":"npvs_v1_container_smoke",
                  "__file__":"/opt/spdecode/tests/test_npvs_v1_legacy.py"}
          exec(compile(sys.stdin.read(), "<synthetic-npvs-v1>", "exec"), module)
          from engine import decode_file
          fixture,credentials,expected=module["make_v1"]()
          output=decode_file("npvs",fixture)
          assert output["structuredJson"]==expected
          assert output["isPartial"] is False
          print("NPVS v1 signed synthetic Docker full JSON OK")
          ' < tests/test_npvs_v1_legacy.py
      - name: Tear down
        if: always()
        run: docker compose -f cloud/compose.yaml down --remove-orphans
