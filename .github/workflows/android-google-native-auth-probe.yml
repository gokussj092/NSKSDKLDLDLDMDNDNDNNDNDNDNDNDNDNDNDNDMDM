name: SP-DECODE Google native auth production probe
on:
  push:
    branches: [ci/unity-ads-online-qa]
    paths:
      - '.github/workflows/android-google-native-auth-probe.yml'
      - 'scripts/ci/probe_native_google_auth.py'
      - 'tests/test_native_google_auth_contract.py'
      - 'android/app/src/main/java/com/ghostdeveloper/spdecode/NativeCommerceAuth.kt'
      - 'android/app/src/main/java/com/ghostdeveloper/spdecode/NativeCommerceScreens.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-auth-probe:
    if: github.repository_owner == 'gokussj092'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate client and server source contracts
        run: python3 -m unittest tests.test_native_google_auth_contract -v
      - name: Verify public authentication endpoints without user credentials
        run: python3 scripts/ci/probe_native_google_auth.py
