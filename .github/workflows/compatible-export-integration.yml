name: Compatible export 1.1.21 integration
on:
  push:
    branches: ["feat/temporary-original-app-config-export-lab"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatible-export-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt cryptography
      - name: Python export and Android source contracts
        run: python -m unittest tests.test_compatible_export tests.test_compatible_export_integration tests.test_cloud_c0_inventory tests.test_cloud_c5_source_isolation tests.test_cloud_history_actions tests.test_cloud_c4_android_bridge -v
      - name: Existing worker regressions
        run: python -m unittest discover -s cloud/workers/python -p 'test_*.py' -v
      - name: API policy, administration and legacy clients
        working-directory: cloud/web
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: SDK platform and native toolchain
        run: |
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$MANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Compile Cloud application and synthetic instrumentation without packaging
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
        run: gradle --no-daemon --max-workers=2 :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
