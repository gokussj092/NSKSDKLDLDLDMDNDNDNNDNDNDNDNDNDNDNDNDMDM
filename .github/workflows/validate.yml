name: Validate SP-DECODE

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Guard patched Next.js, React and MessagePack direct dependencies
        run: python -m unittest tests.test_dependency_security_floors -v

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt cryptography==50.0.2

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check installer shell syntax
        run: bash -n installers/install-termux.sh installers/install-vps.sh scripts/spdecode-termux.sh scripts/spdecode-vps.sh

      - name: Validate project
        run: python validate_project.py

      - name: Phase S.3 deny committed credentials, dangerous logs and CI secret dumps
        run: |
          python scripts/android_s3_security_audit.py --report "$RUNNER_TEMP/spdecode-s/s3-security.json"
          PYTHONPATH=. python -m unittest tests.test_android_s3_security_audit -v

      - name: Validate live Android version, JNI bindings and manifest
        run: python scripts/ci/current_android_contracts.py --check

      - name: Run server and Cloud unit tests (no historical Android local decoder parity)
        run: |
          python - <<'PY'
          import unittest

          # Only Cloud/client security contracts are relevant to the shipped APK.
          # Historical test_android_* offline decoder suites are archived, not a release gate.
          cloud_android_contracts = {
              "test_android_native_trust_boundary",
              "test_android_remote_formats",
              "test_android_server_vpn_update_opt_in",
              "test_android_vpn_directory_language_navigation",
              "test_android_catalog_interactions_v120",
          }

          def select_cloud_and_server_tests(group):
              selected = unittest.TestSuite()
              for case in group:
                  if isinstance(case, unittest.TestSuite):
                      selected.addTests(select_cloud_and_server_tests(case))
                  else:
                      module = case.__class__.__module__.rsplit(".", 1)[-1]
                      if not module.startswith("test_android_") or module in cloud_android_contracts:
                          selected.addTest(case)
              return selected

          suite = select_cloud_and_server_tests(unittest.defaultTestLoader.discover("tests"))
          assert suite.countTestCases() > 0, "No Cloud or server tests were discovered"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Validate Android documentation and editable SVGs
        run: python docs/android/validate_docs.py


  private-preproduction:
    name: Private 1.1.24 (35) APK and AAB after complete Android QA
    needs: [validate]
    if: >-
      github.repository == 'gokussj092/NSKSDKLDLDLDMDNDNDNNDNDNDNDNDNDNDNDNDMDM' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/catalog-notifications-donations' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.repository.private == true
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/cloud-private-preproduction-apk.yml
    secrets: inherit
