name: SP-DECODE build35 signed APK and AAB from approved CI
on:
  push:
    branches: [build/v1.1.24-35-ci-approved-signed]
    paths: [.github/workflows/build35-ci-approved-signed.yml]
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: "40a8a93407e9555a014e0b67d4e5ce4707dd4128"
  ORG_GRADLE_PROJECT_noticeFirebaseAPP_ID: "${{ vars.SPDECODE_NOTICE_FIREBASE_APP_ID || '1:78511444369:android:167638a0365236f1ab4a30' }}"
  ORG_GRADLE_PROJECT_noticeFirebaseAPI_KEY: "${{ vars.SPDECODE_NOTICE_FIREBASE_API_KEY || 'AIzaSyCXHGfZDisaa9Viat01K7DvNYGgr5XVnoM' }}"
  ORG_GRADLE_PROJECT_noticeFirebasePROJECT_ID: "${{ vars.SPDECODE_NOTICE_FIREBASE_PROJECT_ID || 'sp-decode-android' }}"
  ORG_GRADLE_PROJECT_noticeFirebaseSENDER_ID: "${{ vars.SPDECODE_NOTICE_FIREBASE_SENDER_ID || '78511444369' }}"
jobs:
  signed-artifacts:
    if: >-
      github.repository == 'gokussj092/NSKSDKLDLDLDMDNDNDNNDNDNDNDNDNDNDNDNDMDM' &&
      github.ref == 'refs/heads/build/v1.1.24-35-ci-approved-signed' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Confirm this is a single workflow-only commit based on 12 passing workflows
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$GITHUB_SHA" --jq '.files[].filename')"
          test "$changed" = '.github/workflows/build35-ci-approved-signed.yml' || { echo "::error::Unexpected code changes"; exit 1; }
          python3 - <<'PY'
          import json,os,subprocess,sys
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['SOURCE_SHA']
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?head_sha={sha}&per_page=100'],text=True))
          names={
            'Validate SP-DECODE','SP-DECODE Cloud C0 baseline','SP-DECODE Cloud C1 Infrastructure',
            'SP-DECODE Cloud C2 Engine Parity','SP-DECODE Cloud C3 Security',
            'SP-DECODE Cloud C4 Android JNI','SP-DECODE Cloud C5 APK Secret Isolation',
            'SP-DECODE Cloud C6 Website and Admin','SP-DECODE Cloud C7 Integration and Parity',
            'SP-DECODE Cloud C8 VPS Installer','SP-DECODE hardware security',
            'SP-DECODE V2 bound transport'}
          passed={r['name'] for r in data['workflow_runs'] if r['head_sha']==sha and
                  r['event']=='pull_request' and r['conclusion']=='success' and r['status']=='completed'}
          missing=names-passed
          for name in sorted(missing):print('::error::Missing CI success: '+name)
          if missing:sys.exit(1)
          print('12/12 CI checks approved on exactly '+sha)
          PY
      - uses: actions/checkout@v4
        with:
          ref: 40a8a93407e9555a014e0b67d4e5ce4707dd4128
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK and native compiler
        run: |
          set -euo pipefail
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$manager" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Restore existing permanent keystore and validate signing identity
        env:
          STORE_BASE64: "${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}"
          STORE_PASSWORD: "${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}"
          PLAY_UPLOAD_CERT: "${{ secrets.SPDECODE_PLAY_UPLOAD_CERT_SHA256 || vars.SPDECODE_PLAY_UPLOAD_CERT_SHA256 }}"
        run: |
          set -euo pipefail
          test -n "$STORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "::error::Missing permanent signing secrets"; exit 1; }
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spdecode-build35.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/spdecode-build35.p12" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          cert="$(keytool -exportcert -storetype PKCS12 -keystore "$RUNNER_TEMP/spdecode-build35.p12" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          test "$cert" = "0fa9f07f2c47464925f3a7b222c9a39ef887738f678b9c918ec6c4fb96162260" || { echo "::error::Original signing certificate mismatch"; exit 1; }
          if [[ -n "$PLAY_UPLOAD_CERT" ]]; then
            pinned="$(printf '%s' "$PLAY_UPLOAD_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            test "$cert" = "$pinned" || { echo "::error::Play upload certificate mismatch"; exit 1; }
          fi
          # The Activity refuses to launch when BOTH embedded signer digests are empty.
          # Carry the VERIFIED permanent APK certificate to Android BuildConfig.
          echo "SPDECODE_RELEASE_STORE_FILE=$RUNNER_TEMP/spdecode-build35.p12" >> "$GITHUB_ENV"
          echo "SPDECODE_TRUSTED_SIGNER_SHA256=$cert" >> "$GITHUB_ENV"
          # Play signs its installs with a distinct public App Signing certificate.
          # Verified against the Play candidate workflow certificate pin.
          echo "SPDECODE_PLAY_APP_SIGNER_SHA256=64760393e52521294b40a1fd978b5bae732b7d8604bd222ca01166a25407854b" >> "$GITHUB_ENV"
      - name: Validate production identity and exclude registration token
        run: |
          grep -Fq 'versionCode = 35' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.1.24"' android/app/build.gradle.kts
          test ! -e android/app/src/main/assets/adi-registration.properties
      - name: Build signed production APK and Google Play AAB
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
          SPDECODE_CLOUD_RELEASE: "true"
          SPDECODE_CLOUD_QA_BUILD: "false"
          SPDECODE_ADI_VERIFICATION_BUILD: "false"
          SPDECODE_RELEASE_STORE_PASSWORD: "${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}"
          SPDECODE_RELEASE_KEY_ALIAS: "${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}"
          SPDECODE_RELEASE_KEY_PASSWORD: "${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}"
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify signatures, package, locales and V2 security
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          grep -Fi 'Signer #1 certificate SHA-256 digest: 0fa9f07f2c47464925f3a7b222c9a39ef887738f678b9c918ec6c4fb96162260' "$RUNNER_TEMP/apk-signature.txt" >/dev/null
          jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-signature.txt"
          grep -Fq 'jar verified' "$RUNNER_TEMP/aab-signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='com.ghostdeveloper.spdecode'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='1.1.24'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='35'" "$RUNNER_TEMP/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          python3 scripts/ci/verify_aab_locales.py "$aab"
          python3 scripts/android_16kb_elf_audit.py "$apk" "$aab"
          python3 tests/cloud_c5_apk_audit.py "$apk"
          python3 scripts/audit_v2_apk.py "$apk" --origin https://api.spdecode.xyz
          # Regression gate: a signed release with blank BuildConfig signer pins
          # silently closes on MainActivity.onCreate (no crash report).
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots=list(Path("android/app/build/generated/source/buildConfig").rglob("BuildConfig.java"))
          matched=[p for p in roots if str(p).endswith("/release/com/ghostdeveloper/spdecode/BuildConfig.java")]
          if len(matched)!=1: raise SystemExit("Release BuildConfig source missing")
          text=matched[0].read_text()
          for key, expected in {
              "TRUSTED_SIGNER_SHA256": "0fa9f07f2c47464925f3a7b222c9a39ef887738f678b9c918ec6c4fb96162260",
              "PLAY_APP_SIGNER_SHA256": "64760393e52521294b40a1fd978b5bae732b7d8604bd222ca01166a25407854b",
          }.items():
              pattern=r'\b'+key+r'\s*=\s*"'+expected+r'"'
              if not re.search(pattern,text):
                  raise SystemExit("Release startup signer pin missing: "+key)
          print("Both release startup signer pins embedded in BuildConfig")
          PY
          mkdir -p dist
          cp "$apk" dist/SP-DECODE-v1.1.24-35-STARTUP-FIX-SIGNED.apk
          cp "$aab" dist/SP-DECODE-v1.1.24-35-STARTUP-FIX-SIGNED.aab
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          printf 'Version: 1.1.24 (35)\nSource SHA: %s\nAPI: https://api.spdecode.xyz\nPermanent signer verified\nNo Google Play upload or public Release performed\n' "$SOURCE_SHA" > dist/BUILD_INFO.txt
      - name: Verify actual signed APK opens MainActivity on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            apk=android/app/build/outputs/apk/release/app-release.apk
            adb install -r "$apk"
            adb shell am force-stop com.ghostdeveloper.spdecode || true
            adb shell am start -W -n com.ghostdeveloper.spdecode/.MainActivity
            sleep 8
            adb shell dumpsys activity activities > "$RUNNER_TEMP/release-activity.txt"
            if ! grep -E '(topResumedActivity|mResumedActivity)=.*com[.]ghostdeveloper[.]spdecode/.*MainActivity' "$RUNNER_TEMP/release-activity.txt" >/dev/null; then
              echo "::error::Signed release does not keep its MainActivity in foreground"
              exit 1
            fi
            echo "Signed release MainActivity remains foreground after launch"
      - name: Upload signed APK and AAB to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-v1.1.24-35-STARTUP-FIX-SIGNED-APK-AAB
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/spdecode-build35.p12"
