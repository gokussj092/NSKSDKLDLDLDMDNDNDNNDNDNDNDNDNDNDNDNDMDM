name: SP-DECODE - Recuperar keystore cifrada (solo propietario)

# Manual only. This workflow intentionally lives on main because GitHub
# requires workflow_dispatch files to exist on the default branch.
on:
  workflow_dispatch:
    inputs:
      age_recipient:
        description: "Clave PUBLICA age1... creada en tu VPS; no pegar clave privada"
        required: true
        type: string
      confirm:
        description: "Escribe exactamente RECUPERAR_MI_KEYSTORE"
        required: true
        type: string

permissions:
  contents: read

jobs:
  encrypted-one-time-export:
    if: >-
      github.repository == 'gokussj092/NSKSDKLDLDLDMDNDNDNNDNDNDNDNDNDNDNDNDMDM' &&
      github.actor == 'gokussj092' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'RECUPERAR_MI_KEYSTORE'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validar receptor publico y dependencias
        shell: bash
        env:
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
        run: |
          set -Eeuo pipefail
          [[ "$AGE_RECIPIENT" =~ ^age1[0-9a-z]{50,90}$ ]] || {
            echo "::error::Debes proporcionar una clave publica age1... valida"
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version
      - name: Empaquetar clave original y credenciales SOLO CIFRADAS
        shell: bash
        env:
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
          ORIGINAL_KEYSTORE_B64: ${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}
          ORIGINAL_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          ORIGINAL_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          ORIGINAL_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          for var in ORIGINAL_KEYSTORE_B64 ORIGINAL_STORE_PASSWORD ORIGINAL_KEY_ALIAS ORIGINAL_KEY_PASSWORD; do
            [[ -n "${!var:-}" ]] || { echo "::error::Falta un secreto de firma de SP-DECODE";exit 1; }
          done
          TMPDIR_RECOVERY="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR_RECOVERY"' EXIT
          # Write private material only inside the runner's short-lived directory.
          printf '%s' "$ORIGINAL_KEYSTORE_B64" | base64 --decode > "$TMPDIR_RECOVERY/upload-key.p12"
          [[ $(stat -c %s "$TMPDIR_RECOVERY/upload-key.p12") -gt 1000 ]] || {
            echo "::error::El secreto no contiene una keystore valida"
            exit 1
          }
          export SPDECODE_TEMP_KEYSTORE="$TMPDIR_RECOVERY/upload-key.p12"
          keytool -list -storetype PKCS12 -keystore "$SPDECODE_TEMP_KEYSTORE" \
            -storepass:env ORIGINAL_STORE_PASSWORD -alias "$ORIGINAL_KEY_ALIAS" >/dev/null
          keytool -exportcert -storetype PKCS12 -keystore "$SPDECODE_TEMP_KEYSTORE" \
            -storepass:env ORIGINAL_STORE_PASSWORD -alias "$ORIGINAL_KEY_ALIAS" |
            sha256sum | awk '{print $1}' > "$TMPDIR_RECOVERY/certificate.sha256"
          python3 - "$TMPDIR_RECOVERY/signing.env" <<'PY'
          import os, pathlib, shlex, sys
          values = {
              "SPDECODE_RELEASE_STORE_FILE": "/etc/spdecode/keys/upload-key.p12",
              "SPDECODE_RELEASE_KEY_ALIAS": os.environ["ORIGINAL_KEY_ALIAS"],
              "SPDECODE_RELEASE_STORE_PASSWORD": os.environ["ORIGINAL_STORE_PASSWORD"],
              "SPDECODE_RELEASE_KEY_PASSWORD": os.environ["ORIGINAL_KEY_PASSWORD"],
          }
          pathlib.Path(sys.argv[1]).write_text(
              "".join(f"{key}={shlex.quote(value)}\\n" for key,value in values.items())
          )
          PY
          # Fail closed: never create unencrypted Actions artifacts.
          tar -C "$TMPDIR_RECOVERY" -cf - upload-key.p12 signing.env certificate.sha256 |
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/spdecode-original-signing.tar.age"
          [[ -s "$RUNNER_TEMP/spdecode-original-signing.tar.age" ]] || exit 1
          echo "Respaldo cifrado. No se muestra ni se publica la keystore, el alias o las contraseñas."
      - name: Descargar solamente el paquete cifrado
        uses: actions/upload-artifact@v4
        with:
          name: SPDECODE-ORIGINAL-KEYSTORE-ENCRYPTED
          path: ${{ runner.temp }}/spdecode-original-signing.tar.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
