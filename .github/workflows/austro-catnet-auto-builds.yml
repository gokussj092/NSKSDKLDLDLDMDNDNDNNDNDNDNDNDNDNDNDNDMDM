name: AustroPlus Catnet and Tunneltweak auto builds
on:
  push:
    branches: [feat/nuevas-integraciones, main]
    paths:
      - decoders/Python/apps/AustroPlus_VPN/**
      - decoders/Python/apps/CATNET_VPN/**
      - decoders/Python/apps/Tunneltweak/**
      - cloud/web/lib/server-vpn-provider.mjs
      - cloud/web/lib/tunneltweak-builds.mjs
      - cloud/web/content/tunneltweak-builds.seed.json
      - cloud/web/tests/tunneltweak-builds.test.mjs
      - analysis/xyz.tekidoer.austroplus.vpn/**
      - analysis/net.catnet.vpn/**
      - analysis/com.tunneltweak.loyalteams/53/**
      - tests/test_austroplus*
      - tests/test_catnet*
      - tests/test_tunneltweak*
      - .github/workflows/austro-catnet-auto-builds.yml
  pull_request:
    branches: [main, feat/nuevas-integraciones]
    paths:
      - decoders/Python/apps/AustroPlus_VPN/**
      - decoders/Python/apps/CATNET_VPN/**
      - decoders/Python/apps/Tunneltweak/**
      - cloud/web/lib/server-vpn-provider.mjs
      - cloud/web/lib/tunneltweak-builds.mjs
      - cloud/web/content/tunneltweak-builds.seed.json
      - cloud/web/tests/tunneltweak-builds.test.mjs
      - analysis/xyz.tekidoer.austroplus.vpn/**
      - analysis/net.catnet.vpn/**
      - analysis/com.tunneltweak.loyalteams/53/**
      - tests/test_austroplus*
      - tests/test_catnet*
      - tests/test_tunneltweak*
      - .github/workflows/austro-catnet-auto-builds.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  methods-and-auto-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install pycryptodome==3.23.0 argon2-cffi==25.1.0
      - name: Lowercase catalogs, old formats, policy gate, retries and persistent build recovery
        run: python -m unittest tests.test_austroplus15 tests.test_austroplus_vpn tests.test_catnet_vpn tests.test_catnet_retry tests.test_tunneltweak tests.test_tunneltweak_builds -v
      - name: Install existing server test dependencies
        working-directory: cloud/web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Real broker transport and JSON history regression
        working-directory: cloud/web
        run: node --test tests/tunneltweak-builds.test.mjs tests/catnet-vpn.test.mjs tests/server-vpn-provider.test.mjs tests/server-vpn-catalog.test.mjs
