name: SP-DECODE catalog background test APK (1.1.33 b48)
# One signed APK artifact for the owner to review from the exact test branch.
on:
  push:
    branches: [ci/catalog-background-b48-apk]
    paths:
      - .github/workflows/android-catalog-background-b48-apk.yml
permissions:
  contents: read
concurrency:
  group: spdecode-b48-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'gokussj092/NSKSDKLDLDLDMDNDNDNNDNDNDNDNDNDNDNDNDMDM' && github.ref == 'refs/heads/ci/catalog-background-b48-apk' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
      SPDECODE_CLOUD_RELEASE: "true"
      SPDECODE_CLOUD_QA_BUILD: "false"
      # Public mobile ads identifiers, not credentials. Used only by this QA build.
      SPDECODE_UNITY_APP_KEY: "29755d275"
      SPDECODE_UNITY_INTERSTITIAL_ID: "ouy4i00ulql2cxj3"
      SPDECODE_UNITY_UMP_APP_ID: "ca-app-pub-6771239583897519~8354694124"
      ORG_GRADLE_PROJECT_noticeFirebaseAPP_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_APP_ID || secrets.SPDECODE_NOTICE_FIREBASE_APP_ID }}
      ORG_GRADLE_PROJECT_noticeFirebaseAPI_KEY: ${{ vars.SPDECODE_NOTICE_FIREBASE_API_KEY || secrets.SPDECODE_NOTICE_FIREBASE_API_KEY }}
      ORG_GRADLE_PROJECT_noticeFirebasePROJECT_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_PROJECT_ID || secrets.SPDECODE_NOTICE_FIREBASE_PROJECT_ID }}
      ORG_GRADLE_PROJECT_noticeFirebaseSENDER_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_SENDER_ID || secrets.SPDECODE_NOTICE_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assert Firebase Android push configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in \
            ORG_GRADLE_PROJECT_noticeFirebaseAPP_ID \
            ORG_GRADLE_PROJECT_noticeFirebaseAPI_KEY \
            ORG_GRADLE_PROJECT_noticeFirebasePROJECT_ID \
            ORG_GRADLE_PROJECT_noticeFirebaseSENDER_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error title=Android FCM not configured::Missing GitHub Actions variable ${key#ORG_GRADLE_PROJECT_noticeFirebase}"
              missing=1
            fi
          done
          if ((missing)); then
            echo "::error::Set all four SPDECODE_NOTICE_FIREBASE_* repository variables before producing a push-enabled APK."
            exit 1
          fi
          echo "Firebase Android public identifiers present. Device delivery requires runtime verification."
      - name: Validate V2Box v1/v2 protected exports
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input pycryptodome==3.23.0
          python3 -m unittest tests.test_v2box_password -v
      - name: Version and source preflight
        run: |
          set -euo pipefail
          python3 scripts/ci/current_android_contracts.py --github-env "$GITHUB_ENV"
          python3 scripts/ci/verify_aab_locales.py --source-only
          python3 -m unittest tests.test_android_server_vpn_update_opt_in tests.test_android_catalog_interactions_v120 -v
          python3 scripts/android_s3_security_audit.py
          python3 scripts/android_s4_provisioning_audit.py
          # Normal production pacing; dashboard must remain in test mode for QA.
          python3 -m unittest tests.test_android_unity_release_contract tests.test_cloud_c8_user_errors -v
          python3 -m unittest tests.test_catalog_entry_prompt -v
          python3 -m unittest tests.test_android_ssh_accounts_ui -v
          python3 -m unittest tests.test_android_support_chat_design -v
          python3 -m unittest discover -s cloud/infra/vps/tests -p 'test_support_secret_setup.py' -v
          bash -n cloud/infra/vps/spdecodectl
      - name: Android SDK / NDK
        run: |
          set -euo pipefail
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$MANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Restore permanent signing key (secrets only)
        env:
          STORE_BASE64: ${{ secrets.SPDECODE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
          PLAY_CERT: ${{ secrets.SPDECODE_PLAY_APP_SIGNER_SHA256 || vars.SPDECODE_PLAY_APP_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$STORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spdecode-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/spdecode-release.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          CERT="$(keytool -exportcert -keystore "$RUNNER_TEMP/spdecode-release.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          test "$CERT" = "0fa9f07f2c47464925f3a7b222c9a39ef887738f678b9c918ec6c4fb96162260"
          PLAY_CERT="$(printf '%s' "$PLAY_CERT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test "$PLAY_CERT" = "64760393e52521294b40a1fd978b5bae732b7d8604bd222ca01166a25407854b"
          echo "SPDECODE_TRUSTED_SIGNER_SHA256=$CERT" >> "$GITHUB_ENV"
          echo "SPDECODE_PLAY_APP_SIGNER_SHA256=$PLAY_CERT" >> "$GITHUB_ENV"
          echo "SPDECODE_RELEASE_STORE_FILE=$RUNNER_TEMP/spdecode-release.p12" >> "$GITHUB_ENV"
      - name: Compile production signed APK
        working-directory: android
        env:
          SPDECODE_RELEASE_STORE_PASSWORD: ${{ secrets.SPDECODE_SIGNING_STORE_PASSWORD }}
          SPDECODE_RELEASE_KEY_ALIAS: ${{ secrets.SPDECODE_SIGNING_KEY_ALIAS }}
          SPDECODE_RELEASE_KEY_PASSWORD: ${{ secrets.SPDECODE_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --max-workers=2 -PspdecodeUnityAds=true -PspdecodeAdsEveryFileQa=false :app:testReleaseUnitTest :app:assembleRelease
      - name: Validate signed external APK only (no AAB)
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          # Validate current metadata from Gradle, never pin to an old release.
          # aapt badging checks below compare these values to the signed APK.
          test "$SPDECODE_VERSION_NAME" = "1.1.33"
          test "$SPDECODE_VERSION_CODE" = "48"
          python3 scripts/ci/verify_release_signer_pins.py
          python3 scripts/android_16kb_elf_audit.py "$APK"
          python3 tests/cloud_c5_apk_audit.py "$APK" --unity-ads
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='$SPDECODE_VERSION_NAME'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='$SPDECODE_VERSION_CODE'"
          # Telegram/distribution APK must not accidentally contain the Play updater.
          python3 - "$APK" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as apk:
              files=set(apk.namelist())
              import hashlib,pathlib
              for name in ['racha-fuego-naranja.gif','racha-fuego-violeta.gif','cofre_cerrado.gif','cofre_abierto.gif']:
                  asset='assets/'+name
                  assert asset in files, 'Missing animated streak asset: '+name
                  actual=apk.read(asset)
                  expected=pathlib.Path('android/app/src/main/assets',name).read_bytes()
                  assert hashlib.sha256(actual).digest()==hashlib.sha256(expected).digest()
                  assert actual[:6] in (b'GIF87a',b'GIF89a')
              print('PASS: all four streak GIFs are packaged byte-for-byte')
              assert "assets/spdecode-play-updates-enabled.marker" not in files
              assert any(x.startswith("classes") and x.endswith(".dex") for x in files)
          print("PASS: signed external APK contains dex and no Play updater marker")
          PY
          mkdir -p dist
          cp "$APK" dist/SP-DECODE-v${SPDECODE_VERSION_NAME}-b${SPDECODE_VERSION_CODE}-test-signed.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf 'Version: %s\nBuild: %s\nSource SHA: %s\nUnity Ads: enabled\nDistribution: release candidate, not published\n' "$SPDECODE_VERSION_NAME" "$SPDECODE_VERSION_CODE" "$GITHUB_SHA" > dist/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-ONLINE-1.1.33-b48-test-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Erase signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/spdecode-release.p12"
