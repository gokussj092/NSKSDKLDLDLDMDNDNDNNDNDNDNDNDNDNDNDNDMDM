name: SP-DECODE Play Edge-to-Edge Emulator Smoke

on:
  push:
    branches: ["feat/austroplus-vpn-13-0-1-decoders"]
    paths:
      - "android/**"
      - ".github/workflows/android-play-ui-insets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-edge-to-edge:
    name: Android API 35/36 system bar geometry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install SDK/NDK for the native transport
        run: |
          set -euo pipefail
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$MANAGER" --install "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Android 15/16 actual UI window inset assertions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ghostdeveloper.spdecode.PlayEdgeToEdgeInstrumentedTest
