name: SP-DECODE Server VPN shared cache tests
on:
  push:
    branches: [ci/unity-ads-online-qa]
    paths:
      - 'cloud/web/lib/server-vpn*'
      - 'cloud/web/lib/c3-store.mjs'
      - 'cloud/web/lib/device-security.mjs'
      - 'cloud/web/lib/v2-transport.mjs'
      - 'cloud/web/lib/v2-routes.mjs'
      - 'cloud/web/lib/bound-auth.mjs'
      - 'cloud/web/lib/c3-session.mjs'
      - 'cloud/web/lib/c3-config.mjs'
      - 'cloud/web/tests/c3-security.test.mjs'
      - 'cloud/web/lib/c10-catalog-watch.mjs'
      - 'cloud/web/tests/v2-security.test.mjs'
      - 'cloud/web/tests/device-security.test.mjs'
      - 'cloud/web/tests/c10-catalog-push.test.mjs'
      - 'cloud/infra/vps/nginx-config.py'
      - 'cloud/infra/vps/tests/test_nginx_rate_isolation.py'
      - 'android/app/src/main/java/com/ghostdeveloper/spdecode/cloud/CloudCatalogUpdates.kt'
      - 'cloud/web/tests/capacity-isolation.test.mjs'
      - 'cloud/web/lib/c35-gateway.mjs'
      - 'cloud/web/tests/c35-import-security.test.mjs'
      - 'tests/test_hexcm_shared_routes.py'
      - 'cloud/workers/python/hex_custom_bridge.py'
      - 'decoders/Python/apps/Hex_Custom/Hex_Custom_10.6.7.py'
      - 'cloud/web/instrumentation.js'
      - 'cloud/web/tests/server-vpn-result-cache.test.mjs'
      - 'cloud/compose.yaml'
      - 'cloud/web/Dockerfile'
      - '.github/workflows/server-vpn-shared-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Nginx metadata bypass contract
        run: python3 cloud/infra/vps/tests/test_nginx_rate_isolation.py
      - name: Check generated production Nginx syntax
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nginx-light openssl
          sudo mkdir -p /etc/letsencrypt/live/spdecode.xyz
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj '/CN=spdecode.xyz' \
            -keyout /etc/letsencrypt/live/spdecode.xyz/privkey.pem \
            -out /etc/letsencrypt/live/spdecode.xyz/fullchain.pem >/dev/null 2>&1
          python3 cloud/infra/vps/nginx-config.py spdecode.xyz \
            --api-domain api.spdecode.xyz --panel-domain panel.spdecode.xyz --www \
            > /tmp/spdecode-vhosts.conf
          cat > /tmp/spdecode-nginx-ci.conf <<'NGINX'
          worker_processes 1;
          pid /tmp/spdecode-nginx-ci.pid;
          events { worker_connections 64; }
          http {
              include /etc/nginx/mime.types;
              include /tmp/spdecode-vhosts.conf;
          }
          NGINX
          sudo nginx -t -c /tmp/spdecode-nginx-ci.conf
      - name: Install Cloud unit test dependencies
        run: npm ci --prefix cloud/web --no-audit --no-fund
      - name: Validate syntax, quota isolation, signed transport and catalog watch
        working-directory: cloud/web
        run: |
          set -euo pipefail
          for file in lib/server-vpn-result-cache.mjs lib/server-vpn-cache-controls.mjs lib/server-vpn-cache-refresh.mjs lib/server-vpn-gateway.mjs lib/c35-gateway.mjs lib/c10-catalog-watch.mjs lib/device-security.mjs lib/v2-routes.mjs lib/v2-transport.mjs lib/bound-auth.mjs lib/c3-session.mjs lib/c3-config.mjs instrumentation.js; do
            node --check "$file"
          done
          node --test tests/server-vpn-result-cache.test.mjs tests/capacity-isolation.test.mjs tests/c10-catalog-push.test.mjs tests/v2-security.test.mjs tests/device-security.test.mjs tests/c3-security.test.mjs tests/c35-import-security.test.mjs
      - name: Verify Hex Custom and Hex Tunnel share only the suffix, not the decoder
        run: python3 -m unittest tests.test_hexcm_shared_routes -v
      - name: Validate Docker Compose
        run: docker compose -f cloud/compose.yaml config --quiet
      - name: Build web image (including instrumentation and volume)
        run: docker build -t spdecode-cache-test cloud/web
