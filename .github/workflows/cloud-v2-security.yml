name: SP-DECODE V2 bound transport
on:
  pull_request:
    paths: ["android/**", "cloud/**", "scripts/audit_v2_apk.py", ".github/workflows/cloud-v2-security.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cloud web test dependencies
        working-directory: cloud/web
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Adversarial transport and existing API tests
        working-directory: cloud/web
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Real host JNI registration and UTF-8 integration
        run: |
          cmake -S android/app/src/main/cpp -B /tmp/spdecode-native -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-I$JAVA_HOME/include -I$JAVA_HOME/include/linux" \
            -DSPDECODE_CLOUD_ORIGIN=https://api.spdecode.example
          cmake --build /tmp/spdecode-native -j2
          python3 scripts/ci/current_android_contracts.py --generate-host-java "$RUNNER_TEMP/spdecode-jni-sources"
          javac -d /tmp/spdecode-jni-test \
            tests/native/v2_transport_jni/android/content/Context.java \
            "$RUNNER_TEMP/spdecode-jni-sources/CloudNativeTransport.java"
          java -Xcheck:jni -Dspdecode.native=/tmp/spdecode-native/libv7q3.so \
            -cp /tmp/spdecode-jni-test com.ghostdeveloper.spdecode.cloud.CloudNativeTransport
      - name: Install Android SDK and NDK
        run: |
          MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$MANAGER" --install "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Compile minified Cloud client without production signing secrets
        working-directory: android
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.example
          SPDECODE_CLOUD_RELEASE: "true"
        run: gradle --no-daemon :app:assembleRelease
      - name: Inspect actual production DEX and native library
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          python3 tests/cloud_c5_apk_audit.py "$APK"
          python3 scripts/audit_v2_apk.py "$APK" --origin https://api.spdecode.example
      - name: Reclaim unused runner toolchains for Android emulator storage
        run: |
          # Ephemeral GitHub runner only. Preserve Java, Python, NDK and SDK.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h "$GITHUB_WORKSPACE"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Keystore, Unicode vector and real JNI loading
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.example
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ghostdeveloper.spdecode.CloudTransportProofInstrumentedTest,com.ghostdeveloper.spdecode.CatalogFeaturesInstrumentedTest
      - name: Retain Android test reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-android-test-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
