name: SP-DECODE Native HPKE Android Release Compilation
on:
  push:
    branches: [security/hpke-native-cpp-migration]
    paths:
      - .github/workflows/native-hpke-android-compile.yml
      - android/app/src/main/cpp/**
      - android/app/src/main/java/com/ghostdeveloper/spdecode/cloud/CloudRequestProof.kt
      - android/app/src/main/java/com/ghostdeveloper/spdecode/cloud/CloudKeystorePlatform.kt
      - android/app/src/main/java/com/ghostdeveloper/spdecode/cloud/CatalogEnvelope.kt
      - tests/native_jni_contract.py
      - android/app/proguard-rules.pro
      - android/app/src/main/java/com/ghostdeveloper/spdecode/cloud/CloudNativeTransport.kt
      - android/app/src/main/java/com/ghostdeveloper/spdecode/cloud/CloudDecodeClient.kt
      - android/app/src/main/java/com/ghostdeveloper/spdecode/ReleaseIntegrity.kt
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: spdecode-native-hpke-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-r8:
    if: github.repository_owner == 'gokussj092' && github.ref == 'refs/heads/security/hpke-native-cpp-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SPDECODE_CLOUD_API_BASE_URL: https://api.spdecode.xyz
      SPDECODE_CLOUD_RELEASE: "true"
      SPDECODE_CLOUD_QA_BUILD: "false"
      ORG_GRADLE_PROJECT_noticeFirebaseAPP_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_APP_ID }}
      ORG_GRADLE_PROJECT_noticeFirebaseAPI_KEY: ${{ vars.SPDECODE_NOTICE_FIREBASE_API_KEY }}
      ORG_GRADLE_PROJECT_noticeFirebasePROJECT_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_PROJECT_ID }}
      ORG_GRADLE_PROJECT_noticeFirebaseSENDER_ID: ${{ vars.SPDECODE_NOTICE_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Verify all native registration signatures before building
        run: python3 tests/native_jni_contract.py
      - name: Install SDK Android 36, NDK 27 and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Compile RELEASE with native C++ HPKE, R8 and AAB (unsigned)
        working-directory: android
        run: gradle --no-daemon --max-workers=2 :app:assembleRelease :app:bundleRelease
      - name: Audit compiled binaries, locales and source cryptography
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          test -s android/app/build/outputs/mapping/release/mapping.txt
          python3 -m unittest tests.test_cloud_c5_source_isolation
          python3 scripts/ci/verify_aab_locales.py "$AAB"
          python3 tests/cloud_c5_apk_audit.py "$APK"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path('android/app/build/outputs/apk/release/app-release-unsigned.apk')
          kotlin=Path('android/app/src/main/java/com/ghostdeveloper/spdecode/cloud/V2HpkeEnvelope.kt').read_text()
          assert 'org.bouncycastle' not in kotlin
          assert 'javax.crypto.Cipher' not in kotlin
          assert 'MBEDTLS_MD_SHA256' in Path('android/app/src/main/cpp/spdecode_hpke.cpp').read_text()
          assert 'mbedtls_gcm_auth_decrypt' in Path('android/app/src/main/cpp/spdecode_hpke.cpp').read_text()
          with ZipFile(apk) as z:
              names=z.namelist()
              assert not any('org/bouncycastle/x509/CertPathReviewerMessages' in n for n in names), 'BC resource in Cloud APK'
              libs=[n for n in names if n.endswith('/libv7q3.so')]
              assert len(libs)>=4,libs
              for name in libs:
                  payload=z.read(name)
                  assert payload[:4]==b'\x7fELF',name
                  assert b'SPH2' in payload,name
                  assert b'HPKE-v1' in payload,name
          print('PASS: 4+ native ABI libs with HPKE key schedule and no Kotlin HPKE crypto')
          PY
      - name: Store unsigned compilation for static inspection only
        uses: actions/upload-artifact@v4
        with:
          name: SP-DECODE-NATIVE-HPKE-UNSIGNED-RELEASE-COMPILE
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 4
