# C1 development topology. Not a public production deployment.
services:
  web:
    build:
      context: ./web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      WORKER_INTERNAL_URL: http://decoder-worker:8787
      CLOUD_CATALOG_CHUNKS_ENABLED: ${CLOUD_CATALOG_CHUNKS_ENABLED:-false}
      CLOUD_SERVER_VPN_CACHE_ENABLED: ${CLOUD_SERVER_VPN_CACHE_ENABLED:-true}
      CLOUD_SERVER_VPN_CACHE_REVISION: ${CLOUD_SERVER_VPN_CACHE_REVISION:-1}
      CLOUD_SERVER_VPN_CACHE_ROOT: /app/server-vpn-results
      CLOUD_API_ENABLED: ${CLOUD_API_ENABLED:-false}
      CLOUD_QA_ENABLED: ${CLOUD_QA_ENABLED:-false}
      CLOUD_QA_EXPIRES_AT: ${CLOUD_QA_EXPIRES_AT:-0}
      CLOUD_WORKER_TOKEN: ${CLOUD_WORKER_TOKEN:-}
      CLOUD_SESSION_SIGNING_KEY: ${CLOUD_SESSION_SIGNING_KEY:-}
      CLOUD_REDIS_URL: redis://redis:6379
      CLOUD_TRUST_PROXY: ${CLOUD_TRUST_PROXY:-false}
      CLOUD_GOOGLE_PLAY_PACKAGE: ${CLOUD_GOOGLE_PLAY_PACKAGE:-}
      CLOUD_NOTICE_FCM_SERVICE_ACCOUNT_JSON: ${CLOUD_NOTICE_FCM_SERVICE_ACCOUNT_JSON:-}
      CLOUD_NOTICE_STORE_PATH: /app/notices/feed.json
      CLOUD_NOTICE_FCM_PROJECT_ID: sp-decode-android
      CLOUD_GOOGLE_SERVICE_ACCOUNT_JSON: ${CLOUD_GOOGLE_SERVICE_ACCOUNT_JSON:-}
      CLOUD_REQUIRE_LICENSED: ${CLOUD_REQUIRE_LICENSED:-true}
      # Requires explicit VPS opt-in AND time-limited Redis/admin action.
      CLOUD_BETA_ADMISSION_ENABLED: ${CLOUD_BETA_ADMISSION_ENABLED:-false}
      CLOUD_REQUIRE_STRONG_INTEGRITY: ${CLOUD_REQUIRE_STRONG_INTEGRITY:-false}
      CLOUD_LEGACY_API_ENABLED: ${CLOUD_LEGACY_API_ENABLED:-true}
      CLOUD_PLAY_CERT_SHA256: ${CLOUD_PLAY_CERT_SHA256:-}
      CLOUD_MIN_ANDROID_VERSION_CODE: ${CLOUD_MIN_ANDROID_VERSION_CODE:-33}
      CLOUD_V2_SESSION_EPOCH: ${CLOUD_V2_SESSION_EPOCH:-1}
      # V2 HPKE is opt-in; the private keyring is supplied only from protected VPS env.
      CLOUD_V2_HPKE_ENABLED: ${CLOUD_V2_HPKE_ENABLED:-false}
      CLOUD_V2_HPKE_ONLY: ${CLOUD_V2_HPKE_ONLY:-false}
      CLOUD_V2_HPKE_KEYRING: ${CLOUD_V2_HPKE_KEYRING:-}
      CLOUD_V2_REQUIRE_STRONG_INTEGRITY: ${CLOUD_V2_REQUIRE_STRONG_INTEGRITY:-false}
      CLOUD_V2_REQUIRE_PLAY_PROTECT: ${CLOUD_V2_REQUIRE_PLAY_PROTECT:-false}
      # Supplemental RASP rollout; kill-switch does not alter Play/PoP/HPKE.
      CLOUD_RASP_MODE: ${CLOUD_RASP_MODE:-observe}
      CLOUD_RASP_MIN_VERSION_CODE: ${CLOUD_RASP_MIN_VERSION_CODE:-38}
      CLOUD_RASP_ACCESS_MODE: ${CLOUD_RASP_ACCESS_MODE:-observe}
      CLOUD_V2_REQUIRE_ACCESS_RISK: ${CLOUD_V2_REQUIRE_ACCESS_RISK:-false}
      CLOUD_KEY_ATTESTATION_REQUIRED: ${CLOUD_KEY_ATTESTATION_REQUIRED:-true}
      CLOUD_KEY_ATTESTATION_LEVEL: ${CLOUD_KEY_ATTESTATION_LEVEL:-tee}
      CLOUD_KEY_ATTESTATION_URL: http://key-attestation:8788/verify
      CLOUD_KEY_ATTESTATION_TOKEN: ${CLOUD_KEY_ATTESTATION_TOKEN:-}
      CLOUD_ACTION_INTEGRITY_REQUIRED: ${CLOUD_ACTION_INTEGRITY_REQUIRED:-true}
      CLOUD_GOOGLE_CLOUD_PROJECT_NUMBER: ${CLOUD_GOOGLE_CLOUD_PROJECT_NUMBER:-}
      CLOUD_INTEGRITY_MIN_DEVICE_SDK: ${CLOUD_INTEGRITY_MIN_DEVICE_SDK:-24}
      CLOUD_INTEGRITY_MAX_RECENT_ACTIVITY: ${CLOUD_INTEGRITY_MAX_RECENT_ACTIVITY:-3}
      CLOUD_V1_REQUIRE_BOUND_SESSION: ${CLOUD_V1_REQUIRE_BOUND_SESSION:-false}
      # C6 admin disabled unless every independent server-side value is provisioned.
      CLOUD_ADMIN_ENABLED: ${CLOUD_ADMIN_ENABLED:-false}
      CLOUD_ADMIN_USERNAME: ${CLOUD_ADMIN_USERNAME:-}
      CLOUD_ADMIN_PASSWORD_SCRYPT: ${CLOUD_ADMIN_PASSWORD_SCRYPT:-}
      CLOUD_ADMIN_SESSION_KEY: ${CLOUD_ADMIN_SESSION_KEY:-}
      CLOUD_ADMIN_PUBLIC_ORIGIN: ${CLOUD_ADMIN_PUBLIC_ORIGIN:-}
      CLOUD_FORCE_MAINTENANCE: ${CLOUD_FORCE_MAINTENANCE:-false}
      # Emergency lock; normal activation/minimum app version is set in admin.
      CLOUD_COMPATIBLE_EXPORT_LOCKED: ${CLOUD_COMPATIBLE_EXPORT_LOCKED:-false}
      CLOUD_PUBLIC_SITE_INDEX: ${CLOUD_PUBLIC_SITE_INDEX:-false}
      CLOUD_SITE_PUBLIC_ORIGIN: ${CLOUD_SITE_PUBLIC_ORIGIN:-}
      CLOUD_API_PUBLIC_ORIGIN: ${CLOUD_API_PUBLIC_ORIGIN:-}
      CLOUD_SUPPORT_EMAIL: ${CLOUD_SUPPORT_EMAIL:-soporte@spdecode.xyz}
      # Optional Google accounts and commerce; free decoding remains independent.
      SPDECODE_ACCOUNTS_ENABLED: ${SPDECODE_ACCOUNTS_ENABLED:-false}
      SPDECODE_STORE_ENABLED: ${SPDECODE_STORE_ENABLED:-false}
      SPDECODE_DATABASE_URL: ${SPDECODE_DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPDECODE_SHOP_TOKEN_KEY: ${SPDECODE_SHOP_TOKEN_KEY:-}
      # Server-only AES-256-GCM key. Persist in /etc/spdecode/cloud.env, never in the APK.
      SPDECODE_SUPPORT_ENCRYPTION_KEY: ${SPDECODE_SUPPORT_ENCRYPTION_KEY:-}
      SPDECODE_SUPPORT_AGENT_NAME: ${SPDECODE_SUPPORT_AGENT_NAME:-}
      SPDECODE_PAYMENTS_LIVE: ${SPDECODE_PAYMENTS_LIVE:-false}
      SPDECODE_COMMERCIAL_API_ENABLED: ${SPDECODE_COMMERCIAL_API_ENABLED:-false}
      SPDECODE_OFFLINE_LICENSE_READY: ${SPDECODE_OFFLINE_LICENSE_READY:-false}
      SPDECODE_OFFLINE_TIMED_LICENSE_READY: ${SPDECODE_OFFLINE_TIMED_LICENSE_READY:-false}
      SPDECODE_ANALYSIS_CREDITS_READY: ${SPDECODE_ANALYSIS_CREDITS_READY:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      # Opt-in APK static QA, no account or manually enrolled device.
      # Internal web-to-lab credential is generated by the VPS CLI (never embedded in APK).
      CLOUD_APK_QA_ENABLED: ${CLOUD_APK_QA_ENABLED:-false}
      CLOUD_APK_QA_INTERNAL_TOKEN: ${CLOUD_APK_QA_INTERNAL_TOKEN:-}
      # C3.5 provider secrets are strictly backend-only; never NEXT_PUBLIC_*.
      CLOUD_HTTP_CUSTOM_IMPORT_ENABLED: ${CLOUD_HTTP_CUSTOM_IMPORT_ENABLED:-true}
      CLOUD_EHI_IMPORT_ENABLED: ${CLOUD_EHI_IMPORT_ENABLED:-false}
      CLOUD_EHI_SIGN_KEY: ${CLOUD_EHI_SIGN_KEY:-}
      CLOUD_EHI_RESPONSE_KEY: ${CLOUD_EHI_RESPONSE_KEY:-}
      CLOUD_NUR_FETCH_ENABLED: ${CLOUD_NUR_FETCH_ENABLED:-false}
      CLOUD_NUR_CATALOG_URL: ${CLOUD_NUR_CATALOG_URL:-}
      CLOUD_SERVER_VPN_ENABLED: ${CLOUD_SERVER_VPN_ENABLED:-false}
      SPDECODE_VIP_SNIPHER_AUTHORIZATION: ${SPDECODE_VIP_SNIPHER_AUTHORIZATION:-}
      SPDECODE_HALCON_REQUEST_SECRET: ${SPDECODE_HALCON_REQUEST_SECRET:-}
      SPDECODE_HALCON_CATALOG_PASSWORD: ${SPDECODE_HALCON_CATALOG_PASSWORD:-}
      SPDECODE_ALFAISAL_API_KEY: ${SPDECODE_ALFAISAL_API_KEY:-}
      SPDECODE_ALFAISAL_SIGNING_KEY: ${SPDECODE_ALFAISAL_SIGNING_KEY:-}
      SPDECODE_ALFAISAL_DEVICE_UUID: ${SPDECODE_ALFAISAL_DEVICE_UUID:-}
      # Must increase on every roster, icon or provider-availability change.
      CLOUD_SERVER_VPN_CATALOG_VERSION: ${CLOUD_SERVER_VPN_CATALOG_VERSION:-11}
      # Optional versioned release notes. Validated server-side, no APK update required.
      # Legacy V1-only editorial notice; never shared with bound V2 transport.
      CLOUD_WHATS_NEW_V1_JSON: ${CLOUD_WHATS_NEW_V1_JSON:-}
      # Existing V2 editorial notice and optional override are preserved.
      CLOUD_WHATS_NEW_JSON: ${CLOUD_WHATS_NEW_JSON:-}
    # Allowlisted provider switches and nonsecret Tunneltweak build history
    # persist here. Redis sessions/challenges remain ephemeral and isolated.
    volumes:
      - provider-control:/app/provider-control:rw
      - catalog-snapshots:/app/catalog-snapshots:rw
      - server-vpn-results:/app/server-vpn-results:rw
      - notice-feed:/app/notices:rw
      # Signed public APKs are host-published, atomic and read-only to Next.js.
      - ${SPDECODE_PUBLIC_APK_DIR:-/opt/spdecode/public-apks}:/app/public-apks:ro
    ports:
      # Bound to host loopback only; public HTTPS reverse proxy is a later phase.
      - "127.0.0.1:3000:3000"
    networks:
      - edge
      - private
      - apk-private
    depends_on:
      decoder-worker:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /app/.next/cache:size=32m,nosuid
    mem_limit: 1024m
    pids_limit: 128
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s

  # Opt-in private APK QA lab: independent from the production decoder-worker.
  # Starts only with: docker compose --profile apk-qa ...
  # Never mount the cloud.env file, keyrings, Redis or host Docker socket here.
  apk-qa:
    profiles: ["apk-qa"]
    build:
      context: ..
      dockerfile: ${SPDECODE_APK_QA_DOCKERFILE:-cloud/apk_analysis/Dockerfile.qa}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    environment:
      SPDECODE_APK_QA_INTERNAL_TOKEN: ${CLOUD_APK_QA_INTERNAL_TOKEN:-}
      SPDECODE_APK_QA_ROOT: /var/lib/spdecode/apkqa
      SPDECODE_APK_QA_TOOL_MODE: metadata
      SPDECODE_APK_QA_TOOLS_REMOTE: ${CLOUD_APK_QA_TOOLS_REMOTE:-disabled}
      SPDECODE_APK_QA_TOOLS_TOKEN: ${CLOUD_APK_QA_TOOLS_TOKEN:-}
    volumes:
      - apk-qa-jobs:/var/lib/spdecode/apkqa:rw
    networks: [apk-private, apk-tools-private]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${SPDECODE_APK_QA_MEM_LIMIT:-320m}
    cpus: 0.8
    pids_limit: 48
    tmpfs:
      - /tmp:size=48m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://127.0.0.1:8792/health',timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 4

  # Optional, operator-enabled tool worker on an appropriately sized host.
  # Only the receiving apk-qa container can send vetted APK/APKS bytes here.
  # Never publish a port or mount HPKE keys / Docker socket / decoder volumes.
  apk-tools:
    profiles: ["apk-qa-tools"]
    build:
      context: ..
      dockerfile: ${SPDECODE_APK_TOOLS_DOCKERFILE:-cloud/apk_analysis/Dockerfile.qa-tools}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    environment:
      SPDECODE_APK_QA_TOOLS_TOKEN: ${CLOUD_APK_QA_TOOLS_TOKEN:-}
      SPDECODE_APK_QA_TOOL_MODE: enabled
      SPDECODE_APK_QA_TOOLS_REVIEWED: ${CLOUD_APK_QA_TOOLS_REVIEWED:-false}
      SPDECODE_APK_QA_TOOLS_SCRATCH: /analysis
      SPDECODE_APK_QA_LITE: ${SPDECODE_APK_QA_LITE:-false}
      SPDECODE_APK_QA_GHIDRA: ${SPDECODE_APK_QA_GHIDRA:-disabled}
    networks: [apk-tools-private]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${SPDECODE_APK_TOOLS_MEM_LIMIT:-4096m}
    cpus: ${SPDECODE_APK_TOOLS_CPUS:-1.8}
    pids_limit: 96
    # Disk-backed scratch: APKS and JADX source trees don't exhaust VPS RAM.
    volumes:
      - apk-tools-scratch:/analysis:rw
    tmpfs:
      - /tmp:size=48m,uid=65532,gid=65532,mode=0700,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request;urllib.request.urlopen('http://127.0.0.1:8793/health',timeout=3).read()"]
      interval: 25s
      timeout: 5s
      retries: 4

  key-attestation:
    profiles: ["hardware-security"]
    build:
      context: ./attestation
    restart: unless-stopped
    init: true
    environment:
      CLOUD_KEY_ATTESTATION_TOKEN: ${CLOUD_KEY_ATTESTATION_TOKEN:-}
      CLOUD_GOOGLE_PLAY_PACKAGE: ${CLOUD_GOOGLE_PLAY_PACKAGE:-}
      CLOUD_PLAY_CERT_SHA256: ${CLOUD_PLAY_CERT_SHA256:-}
      CLOUD_MIN_ANDROID_VERSION_CODE: ${CLOUD_MIN_ANDROID_VERSION_CODE:-33}
      CLOUD_KEY_ATTESTATION_LEVEL: ${CLOUD_KEY_ATTESTATION_LEVEL:-tee}
      CLOUD_KEY_MAX_PATCH_AGE_MONTHS: ${CLOUD_KEY_MAX_PATCH_AGE_MONTHS:-12}
    # Private API; edge permits only outbound Google revocation checks. No host ports.
    networks: [private, edge]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 64
    cpus: 1.0
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]


  shop-db:
    profiles: [commerce]
    image: postgres:16-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: spdecode_admin
      POSTGRES_DB: spdecode_shop
      POSTGRES_PASSWORD: ${SPDECODE_SHOP_DB_PASSWORD:-}
      SPDECODE_SHOP_APP_PASSWORD: ${SPDECODE_SHOP_APP_PASSWORD:-}
    volumes:
      - shop-database:/var/lib/postgresql/data
      - ./accounts/shop-db-init.sh:/docker-entrypoint-initdb.d/00-shop-role.sh:ro
    networks: [private]
    # No host port and no access to decoder/keyring volumes.
    read_only: true
    tmpfs: ["/var/run/postgresql:size=8m,uid=70,gid=70,mode=0770", "/tmp:size=16m,nosuid,noexec"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U spdecode_admin -d spdecode_shop"]
      interval: 10s
      timeout: 4s
      retries: 6

  redis:
    image: redis:7.4-alpine
    user: "redis"
    restart: unless-stopped
    init: true
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    networks: [private]
    # No external ports; no persisted challenges, sessions or credentials.
    read_only: true
    tmpfs:
      - /data:size=64m,nosuid,noexec,uid=999,gid=999,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  decoder-worker:
    build:
      context: ..
      dockerfile: cloud/workers/python/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      WORKER_BIND_HOST: 0.0.0.0
      WORKER_PORT: "8787"
      CLOUD_WORKER_TOKEN: ${CLOUD_WORKER_TOKEN:-}
      SPDECODE_HALCON_CATALOG_PASSWORD: ${SPDECODE_HALCON_CATALOG_PASSWORD:-}
    # No host port/account credentials/shared volumes. Halcon's content key is
    # forwarded only to its allowlisted catalog child, never other decoders.
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    pids_limit: 64
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=2).read()"]
      interval: 30s
      timeout: 8s
      retries: 6
      start_period: 30s

volumes:
  shop-database: {}
  provider-control: {}
  catalog-snapshots: {}
  server-vpn-results: {}
  notice-feed: {}
  apk-qa-jobs: {}
  apk-tools-scratch: {}

networks:
  edge: {}
  private:
    internal: true
  apk-tools-private:
    internal: true
  apk-private:
    internal: true
